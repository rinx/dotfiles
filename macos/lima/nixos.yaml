# Template using nixos-lima
# ref: https://github.com/nixos-lima/nixos-lima
images:
  - location: "https://github.com/rinx/dotfiles/releases/download/2026.09.26/nixos-lima-aarch64.qcow2"
    arch: "aarch64"
    digest: "sha512:75fd31638f8b3cb28ff40a152bd2fffab929dfcef7d8e729a4aa5a7ebb4abd3aff9d7848288bdf739c9e60a1e52d2220e212f0bf2952eef15ff62c392a4570c9"
  - location: "https://github.com/rinx/dotfiles/releases/download/2026.09.26/nixos-lima-x86_64.qcow2"
    arch: "x86_64"
    digest: "sha512:2b7f5e527e1c777a9633eaeba85b9fc8fae1a3968d0bb86a45ebfe31add9420fec235275710bfd04813054a891a7f2d1548a38be815b8a7e803962465077511c"
mounts:
  - location: "~"
    writable: false
    9p:
      # Try choosing "mmap" or "none" if you see a stability issue with the default "fscache".
      cache: "mmap"
  - location: "/tmp/lima"
    writable: true
    9p:
      cache: "mmap"
  - location: "~/local"
    mountPoint: "{{.Home}}/local"
    writable: true
    9p:
      cache: "mmap"
  - location: "~/notes"
    mountPoint: "{{.Home}}/notes"
    writable: true
    9p:
      cache: "mmap"
  - location: "~/.dotfiles.local"
    mountPoint: "{{.Home}}/.dotfiles.local"
    writable: true
    9p:
      cache: "mmap"
cpus: 4
memory: 8GiB
portForwards:
  # Tell Lima's port-forwarding to ignore port 68 to prevent interception of host DHCP packets
  # Apparently this is an issue with NixOS that does not occur on other Linux distros
  # See: https://github.com/nixos-lima/nixos-lima/issues/50
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true
  # gpg-agent forwarding
  - hostSocket: "{{.Home}}/.gnupg/S.gpg-agent.extra"
    guestSocket: "{{.Home}}/.S.gpg-agent.host"
    reverse: true
  # # xsr (https://tangled.org/rinx.tngl.sh/xsr)
  # - hostSocket: "/tmp/xsr.sock"
  #   guestSocket: "{{.Home}}/.xsr.sock"
  #   reverse: true
  # # ghtkn (https://github.com/suzuki-shunsuke/ghtkn)
  # - hostSocket: "{{.Home}}/.cache/ghtkn/agent.sock"
  #   guestSocket: "{{.Home}}/.ghtkn.sock"
  #   reverse: true
  # docker
  - hostSocket: "{{.Dir}}/sock/docker.sock"
    guestSocket: "/var/run/docker.sock"
containerd:
  system: false
  user: false
ssh:
  forwardAgent: true
user:
  name: rinx
  shell: /run/current-system/sw/bin/zsh
vmType: vz
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true
message: |
  To initialize the VM environment, execute `home-manager switch`.

      limactl shell {{.Name}} -- nix run nixpkgs#home-manager -- --flake github:rinx/dotfiles#lima switch

  Import GPG pubkey and ownertrust.

      gpg --export --armor 54CEC37D516CF1E59A560DEA2E26B9B26A1D5D29 | limactl shell {{.Name}} -- gpg --import
      gpg --export-ownertrust | limactl shell {{.Name}} -- gpg --import-ownertrust

  Login to the VM.

      limactl shell {{.Name}} -- zsh

  If you use `ghtkn` in the shell, set some environment variables.

      limactl shell {{.Name}} -- GHTKN_BACKEND=agent GHTKN_AGENT_SOCKET=$HOME/.ghtkn.sock GHTKN_APP=rinx/noop zsh

  ---

  To install neovim plugins, run the following command.

      limactl shell {{.Name}} -- nvim --headless -c 'Lazy! restore' -c 'qall'

  ---

  To use `docker` on the host, run the follwing commands.

      docker context create lima-{{.Name}} --docker "host=unix://{{.Dir}}/sock/docker.sock"
      docker context use lima-{{.Name}}

  If you use rosetta, restart these services.

      sudo systemctl restart systemd-binfmt.service
      sudo systemctl restart rosettad.service

  ---

  To install extra packages, run the following commands.

      limactl shell {{.Name}} -- nix profile add github:rinx/dotfiles#extra-packages
      limactl shell {{.Name}} -- nix profile add github:rinx/dotfiles#k8s-packages
